version: 2

models:
  - name: stg_ach_entries
    description: Typed ACH entries with debit/credit and account-type flags derived from the transaction code.
    columns:
      - name: entry_id
        data_tests: [not_null, unique]
      - name: sec_code
        data_tests:
          - accepted_values:
              arguments:
                values: ["PPD", "CCD", "WEB", "TEL"]
      - name: transaction_code
        data_tests:
          - accepted_values:
              arguments:
                values: ["22", "27", "32", "37"]
      - name: amount_cents
        data_tests: [not_null]
      - name: settlement_lag_days
        data_tests: [not_null]

  - name: stg_ach_returns
    description: Typed returns with the return class re-derived from the public R-code mapping.
    columns:
      - name: return_id
        data_tests: [not_null, unique]
      - name: return_class
        data_tests:
          - accepted_values:
              arguments:
                values: ["unauthorized", "administrative", "nsf", "other"]
      - name: original_entry_id
        data_tests:
          - not_null
          # Every return must point at an entry we have. Fails loudly if the
          # ingest ever lands returns for entries it never landed.
          - relationships:
              arguments:
                to: ref('stg_ach_entries')
                field: entry_id

  - name: stg_ach_files
    columns:
      - name: file_id
        data_tests: [not_null, unique]

  - name: stg_originators
    columns:
      - name: company_id
        data_tests: [not_null, unique]
