[project]
name = "ach-data-platform"
version = "0.1.0"
description = "End-to-end ACH data platform: Airflow 3 orchestration, dbt-on-DuckDB lakehouse modeling, Prometheus/Grafana monitoring, and an evaluated LLM anomaly-triage step"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Warehouse + lake. DuckDB is both the query engine and the Parquet writer,
    # so we don't need pyarrow as a separate dependency.
    "duckdb>=1.3,<2",
    "pandas>=2.2",
    # Config + validated LLM output. pydantic is the single schema layer for
    # settings, triage results, and eval records.
    "pydantic>=2.7",
    # Provider-agnostic model calls (Claude / Gemini / local Ollama) -- same
    # pattern as recon-engine; provider is an env var, not a code change.
    "litellm>=1.70",
    # Custom pipeline metrics -> Pushgateway -> Prometheus -> Grafana.
    "prometheus-client>=0.21",
    "requests>=2.32",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# dbt lives in its own environment in Docker (see Dockerfile / ADR-0003), but
# for local runs and CI it's convenient to have it in the same venv.
dbt = [
    "dbt-core>=1.10,<2",
    "dbt-duckdb>=1.9,<2",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]
# Note: apache-airflow is deliberately NOT a dependency here. The DAG files are
# parsed inside the built image (scripts/parse_dags.py, run by the `docker` CI
# job), which tests them against the exact Airflow the platform actually runs
# instead of against a second pin that can silently drift from the Dockerfile.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ach_platform"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "airflow/dags"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
